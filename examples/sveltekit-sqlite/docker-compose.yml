# Attaches a volume to the app. Everything in /data survives updates and restarts.
services:
  app:
    volumes:
      - app-data:/data
    # Hardening, recommended for every app. Remove a line only if your app really needs it:
    init: true               # a tiny init process forwards signals and cleans up child processes
    cap_drop: [ALL]          # the app needs no special Linux privileges
    read_only: true          # the files of the container cannot be changed; only /tmp and the volume stay writable
    tmpfs: [/tmp]
    stop_grace_period: 20s   # time to finish running requests when the container is stopped

volumes:
  app-data:
