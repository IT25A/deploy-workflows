# yaml-language-server: $schema=https://raw.githubusercontent.com/IT25A/deploy-workflows/main/schema/it25a.schema.json
# Additional services (database) come from your own docker-compose.yml
version: 1
compose: docker-compose.yml
services:
  web:
    build: ./frontend
    port: 3000
    route: { host: "@" }
  api:
    build: ./backend
    port: 3001
    route: { host: "@", path: /api }
    environment:
      DATABASE_HOST: db                   # name of the service in the Compose file
    secrets: [DATABASE_PASSWORD]