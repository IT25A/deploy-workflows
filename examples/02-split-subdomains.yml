# yaml-language-server: $schema=https://raw.githubusercontent.com/IT25A/deploy-workflows/main/schema/it25a.schema.json
# Frontend and backend on separate subdomains
version: 1
services:
  web:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: "{{ url.api }}"   # https://api-<alias>.apps.it25a.de
    port: 3000
    route: { host: "@" }                  # https://<alias>.apps.it25a.de
  api:
    build: ./backend
    port: 3001
    route: { host: api }                  # https://api-<alias>.apps.it25a.de
    secrets: [API_KEY]