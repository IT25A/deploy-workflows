# yaml-language-server: $schema=https://raw.githubusercontent.com/IT25A/deploy-workflows/main/schema/it25a.schema.json
# React frontend, Express backend and a PostgreSQL database, on ONE address:
#   https://<alias>.apps.it25a.de        -> frontend
#   https://<alias>.apps.it25a.de/api    -> backend (talks to the database)
version: 1
compose: docker-compose.yml          # defines the database, see docker-compose.yml
services:
  web:
    build: ./frontend
    port: 3000
    route: { host: "@" }
  api:
    build: ./backend
    port: 3000
    route: { host: "@", path: /api }
    # Plain settings. DB_NAME and DB_USER must be the same as POSTGRES_DB and POSTGRES_USER in docker-compose.yml.
    environment:
      DB_HOST: db                    # the name of the database service in docker-compose.yml
      DB_PORT: "5432"                # always in quotes
      DB_NAME: shop
      DB_USER: shop_app
    # Create this secret in GitHub (repository, Settings, Secrets and variables, Actions).
    secrets: [DB_PASSWORD]
