services:
  # The services "web" and "api" are defined in app.it25a.yml. Here only what Compose adds is listed.
  api:
    depends_on:
      db:
        condition: service_healthy   # start the backend only when the database accepts connections
    # Optional hardening: the container's files become read-only, only /tmp stays writable.
    # (The platform already sets init, cap_drop: [ALL] and a 20 second grace period for stopping.)
    read_only: true
    tmpfs: [/tmp]

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: shop              # your own database name (same as DB_NAME in app.it25a.yml)
      POSTGRES_USER: shop_app        # your own database user (same as DB_USER in app.it25a.yml)
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql   # PostgreSQL 18 and newer keep their data below this folder
    healthcheck:
      # "$$" is a literal "$": the shell inside the container fills in the user and the database name.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
